name: Release 3DS artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify tag matches app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          app_version="$(sed -n 's/^#define VERSION "\([^\"]*\)"/\1/p' include/settings.hpp | tr -d '\r')"
          test -n "$app_version"
          test "$app_version" = "$RELEASE_TAG" || {
            echo "Tag $RELEASE_TAG does not match app version $app_version"
            exit 1
          }

      - name: Build all release files
        run: ./build.sh all

      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_TAG"]
          lines = Path("CHANGELOG.md").read_text().splitlines()
          heading = re.compile(r"^## " + re.escape(version) + r"(?:\s|$)")
          start = next((i for i, line in enumerate(lines) if heading.match(line)), None)
          if start is None:
              raise SystemExit(f"No changelog section found for {version}")
          end = next((i for i in range(start + 1, len(lines))
                      if lines[i].startswith("## ")), len(lines))
          notes = "\n".join(lines[start + 1:end]).strip() + "\n"
          Path("release-notes.md").write_text(notes)
          PY

      - name: Publish raw release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum romm3ds.3dsx romm3ds.smdh romm3ds.cia > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "romm3ds $GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file release-notes.md \
            romm3ds.3dsx \
            romm3ds.smdh \
            romm3ds.cia \
            SHA256SUMS
