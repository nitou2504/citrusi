name: Build 3DS artifacts

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'source/**'
      - 'include/**'
      - 'ctr-payload/**'
      - 'romfs/**'
      - 'gfx/**'
      - 'cia/**'
      - 'ctr-template/**'
      - 'icon.png'
      - 'Makefile'
      - 'build.sh'
      - 'push.sh'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'source/**'
      - 'include/**'
      - 'ctr-payload/**'
      - 'romfs/**'
      - 'gfx/**'
      - 'cia/**'
      - 'ctr-template/**'
      - 'icon.png'
      - 'Makefile'
      - 'build.sh'
      - 'push.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CIA and 3DSX
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build all artifacts
        run: ./build.sh all

      - name: Stage artifacts
        run: |
          mkdir -p build_output
          cp romm3ds.3dsx romm3ds.smdh romm3ds.cia build_output/
          sha256sum build_output/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: romm3ds-build
          path: build_output
          if-no-files-found: error
          retention-days: 90
          overwrite: true
